# Requires approval and branch-control checks on the docker-local-lab pool.
trigger: none
pr: none

resources:
  pipelines:
  - pipeline: ci
    source: richardgrim.ci-cd-labs
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main

stages:
- stage: DeployLocal
  displayName: 'Desplegar en Docker local'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DockerLocal
    environment: docker-local
    pool:
      name: docker-local-lab
      demands:
      - Agent.Name -equals richard-docker-local
    timeoutInMinutes: 15
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: false
          - download: none
          - download: ci
            artifact: webapi
          - task: PowerShell@2
            displayName: 'Actualizar contenedor y verificar salud'
            inputs:
              targetType: filePath
              filePath: deploy/deploy-local.ps1
              arguments: '-ArtifactPath "$(Pipeline.Workspace)/ci/webapi/app.jar" -ReleaseId "$(Build.BuildId)"'
              pwsh: false
          - task: NodeTool@0
            displayName: 'Preparar Node.js para Postman'
            inputs:
              versionSpec: '22.x'
          - task: PowerShell@2
            displayName: 'Probar API con Postman/Newman'
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $results = "$(Agent.TempDirectory)/postman-$(Build.BuildId)-$(System.JobAttempt)"
                New-Item -ItemType Directory -Force -Path $results | Out-Null
                npx.cmd --yes newman@6.2.1 run tests/postman/docker-local.json --timeout-request 10000 --reporters cli,junit --reporter-junit-export "$results/results.xml"
                exit $LASTEXITCODE
          - task: PublishTestResults@2
            displayName: 'Publicar resultados de Postman'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              searchFolder: '$(Agent.TempDirectory)/postman-$(Build.BuildId)-$(System.JobAttempt)'
              testResultsFiles: results.xml
              testRunTitle: 'Postman Docker local - $(Build.BuildNumber)'
              failTaskOnFailedTests: true
              failTaskOnFailureToPublishResults: true
              failTaskOnMissingResultsFile: true
