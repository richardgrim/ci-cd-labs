name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "         PIPELINE CI/CD"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Evento: ${{ github.event_name }}"
          echo "================================"

      - name: Compilar aplicación
        run: mvn --batch-mode clean compile -DskipTests

      - name: Ejecutar pruebas y generar cobertura
        run: mvn --batch-mode verify

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."